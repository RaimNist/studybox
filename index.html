<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StudyBox — Registration</title>
  <link rel="stylesheet" href="styles.css">
  <script src="logic.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <h1>StudyBox</h1>
    <h2>Registration</h2>
    <form id="registration" novalidate>
      <div class="field">
        <label for="login">Login</label>
        <input id="login" name="login" type="text" autocomplete="username" aria-describedby="login-error">
        <p id="login-error" class="error" aria-live="polite"></p>
      </div>
      <div class="field">
        <label for="age">Age</label>
        <input id="age" name="age" type="text" inputmode="numeric" aria-describedby="age-error">
        <p id="age-error" class="error" aria-live="polite"></p>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="text" autocomplete="email" aria-describedby="email-error">
        <p id="email-error" class="error" aria-live="polite"></p>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="new-password" aria-describedby="password-error">
        <p id="password-error" class="error" aria-live="polite"></p>
      </div>
      <div class="field">
        <label class="agreement" for="agreement">
          <input id="agreement" name="agreement" type="checkbox" aria-describedby="agreement-error">
          Я принимаю правила сервиса
        </label>
        <p id="agreement-error" class="error" aria-live="polite"></p>
      </div>
      <button type="submit">Register</button>
      <p id="result" role="status" aria-live="polite"></p>
    </form>
  </main>
</body>
</html>
